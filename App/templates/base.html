{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Canopy | Nature Photography{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom Design System -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <!-- STICKY NAVBAR -->
    <nav class="navbar navbar-expand-lg canopy-nav sticky-top py-3">
      <div class="container-fluid px-lg-5">
        <a
          class="navbar-brand fw-bold fs-2 brand-color brand-font text-uppercase d-flex align-items-center"
          href="{% url 'home' %}"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            fill="#bc6c25"
            class="bi bi-tree-fill me-2"
            viewBox="0 0 16 16"
          >
            <path
              d="M8.416.223a.5.5 0 0 0-.832 0l-3 4.5A.5.5 0 0 0 5 5.5h.098L3.076 8.739A.5.5 0 0 0 3.5 9.5h.191l-1.638 3.276a.5.5 0 0 0 .447.724H7V16h2v-2.5h4.5a.5.5 0 0 0 .447-.724L12.31 9.5h.191a.5.5 0 0 0 .424-.761L10.902 5.5H11a.5.5 0 0 0 .416-.777l-3-4.5z"
            />
          </svg>
          CANOPY
        </a>

        <div class="d-flex align-items-center me-auto ms-4 gap-4">
          <a class="nav-link-custom text-uppercase" href="#">EXPLORE</a>
          <a class="nav-link-custom text-uppercase" href="#">CATEGORIES</a>
        </div>

        <div class="d-flex align-items-center">
          {% if user.is_authenticated %}
          <span class="brand-font fs-5 text-uppercase me-3 brand-color"
            >HI, {{ user.username }}</span
          >
          <div class="dropdown">
  <button
    class="avatar-btn p-0 border-0 rounded-circle overflow-hidden"
    type="button"
    data-bs-toggle="dropdown"
    aria-expanded="false"
    style="width: 42px; height: 42px"
  >
    {% if user.profile.avatar and 'default.png' not in user.profile.avatar.url %}
    <img
      src="{{ user.profile.avatar.url }}"
      alt="{{ user.username }}"
      style="width: 100%; height: 100%; object-fit: cover"
    />
    {% else %}
    <div
      class="w-100 h-100 d-flex align-items-center justify-content-center brand-font text-white"
      style="background-color: #b85b14; font-size: 1.2rem; font-weight: 600;"
    >
      {{ user.username|first|upper }}
    </div>
    {% endif %}
  </button>
  <ul class="dropdown-menu dropdown-menu-end dropdown-menu-canopy">
    <li>
      <a class="dropdown-item" href="{% url 'upload' %}">Upload Photo</a>
    </li>
    <li>
      <a class="dropdown-item" href="{% url 'profile' user.username %}">My Profile</a>
    </li>
    <li><hr class="dropdown-divider opacity-10" /></li>
    <li>
      <form action="{% url 'logout' %}" method="POST" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="dropdown-item text-danger">Log Out</button>
      </form>
    </li>
  </ul>
</div>
          {% else %}
          <a
            class="nav-link-custom text-uppercase me-3"
            href="{% url 'login' %}"
            >LOG IN</a
          >
          <a
            class="btn btn-canopy rounded-pill px-4 brand-font text-uppercase fw-semibold"
            href="{% url 'signup' %}"
            >SIGN UP</a
          >
          {% endif %}
        </div>
      </div>
    </nav>

    <main>{% block content %} {% endblock content %}</main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/carousel.js' %}"></script>
  </body>
</html>
